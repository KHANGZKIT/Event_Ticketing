<svg width="240" height="56" viewBox="0 0 240 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="TicketBook Logo">
  <defs>
    <linearGradient id="tbGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="tbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- ICON vé -->
  <g filter="url(#tbShadow)" transform="translate(6,6)">
    <!-- Thân vé -->
    <path d="M8 6a6 6 0 0 1 6-6h60a6 6 0 0 1 6 6v6a6 6 0 0 0 0 12v6a6 6 0 0 1-6 6H14a6 6 0 0 1-6-6v-6a6 6 0 0 0 0-12V6z" fill="url(#tbGrad)"/>
    <!-- Đường răng cưa -->
    <path d="M44 4v28" stroke="white" stroke-width="2" stroke-dasharray="3 4" opacity=".85"/>
    <!-- Ngôi sao: căn giữa phần phải, nâng cao lên -->
    <path d="M62 6l3.6 6.8 7.5 1.1-5.4 5.3 1.3 7.2-6.9-3.5-6.9 3.5 1.3-7.2-5.4-5.3 7.5-1.1L62 6z"
          fill="white" opacity=".95"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(92,17)">
    <text x="0" y="17" font-family="Poppins, Segoe UI, Arial" font-size="22" font-weight="700" fill="#fff">
      <tspan>Ticket</tspan><tspan fill="url(#tbGrad)">Book</tspan>
    </text>
    <text x="0" y="34" font-family="Poppins, Segoe UI, Arial" font-size="10" fill="#ffffffff" letter-spacing=".08em">EVENT PLATFORM</text>
  </g>
</svg>
