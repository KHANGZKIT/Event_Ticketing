<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sự kiện - TicketBook</title>
  <link rel="stylesheet" href="../../HomePage/css/style.css">
  <style>
    /* CSS CỤC BỘ (Giữ nguyên) */
    :root {
      --green: rgb(45, 194, 117);
      --black: rgb(42, 45, 52);
      --dark-gray: rgb(50, 53, 60);
      --white: #ffffff;
    }

    body {
      background: var(--black);
    }

    /* ... (Các style .filters, .results-text, .filters button giữ nguyên) ... */
    .filters {
      background-color: var(--black);
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0 40px;
    }

    .filters .results-text {
      flex: 1;
      font-size: 1.1rem;
      color: #999;
    }

    .filters button {
      background-color: var(--dark-gray);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--white);
      padding: 10px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: background 0.2s ease;
    }

    .filters button:hover,
    .filters button.active {
      background-color: var(--green);
      border-color: var(--green);
    }
  </style>
</head>

<body>
  <div class="header">
    <a href="../../HomePage/source/TrangChu.html"><img src="../../HomePage/logo.svg" alt=""></a>
    <form class="search-bar" action="events-search.html" method="GET">
      <input type="text" name="q" id="search-input" placeholder="Bạn tìm gì hôm nay?">
      <button type="submit">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m21 21-4.34-4.34" />
          <circle cx="11" cy="11" r="8" />
        </svg>
      </button>
    </form>

    <div class="my-ticket">
      <a href="../../my_ticket/source/my_ticket.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path
            d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z" />
          <path d="M13 5v2" />
          <path d="M13 17v2" />
          <path d="M13 11v2" />
        </svg>
        <span>Vé của tôi</span>
      </a>
    </div>
    <a href="create-event.html" class="btn-create-event"
      style="display: inline-flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.15); color: white; padding: 12px 20px; border-radius: 50px; font-weight: 600; font-size: 15px; text-decoration: none; border: 1px solid rgba(255, 255, 255, 0.3); transition: all 0.4s ease; margin-left: 10px;">
      Tạo sự kiện
    </a>
    <div id="authArea" class="auth-area">
    </div>
  </div>

  <div class="filters">
    <p class="results-text" id="results-text">Đang tải sự kiện...</p>
    <button>Tìm theo ngày</button>
    <button id="category-button" class="active">Tất cả</button>
  </div>

  <main class="content">
    <div class="event-grid" id="event-grid-search">
      <div class="skeleton-card">
        <div class="skeleton-img"></div>
        <div class="skeleton-text"></div>
        <div class="skeleton-text short"></div>
      </div>
      <div class="skeleton-card">
        <div class="skeleton-img"></div>
        <div class="skeleton-text"></div>
        <div class="skeleton-text short"></div>
      </div>
      <div class="skeleton-card">
        <div class="skeleton-img"></div>
        <div class="skeleton-text"></div>
        <div class="skeleton-text short"></div>
      </div>
      <div class="skeleton-card">
        <div class="skeleton-img"></div>
        <div class="skeleton-text"></div>
        <div class="skeleton-text short"></div>
      </div>
    </div>
  </main>


  <script src="../../HomePage/js/events.js"></script>


  <script>
    function renderEventsToGrid(events, gridElement) {
      gridElement.innerHTML = ''; // Xóa Skeletons
      if (events.length === 0) {
        gridElement.innerHTML = '<p style="color: #999; grid-column: 1 / -1; text-align: center;">Không tìm thấy sự kiện nào.</p>';
        return;
      }

      events.forEach(event => {
        let image = event.cover && event.cover.trim() !== ''
          ? event.cover
          : FALLBACK_IMAGES[Math.floor(Math.random() * FALLBACK_IMAGES.length)];

        // Dùng các hàm đã được tải từ 'events.js'
        const price = event.price?.display || 'Liên hệ';
        const date = formatDate(event.startsAt || event.minStartsAt || event.price?.firstStartsAt);

        const eventCard = document.createElement('div');
        eventCard.className = 'event-card';
        eventCard.style.cursor = 'pointer';
        eventCard.addEventListener('click', () => {
          // Link đến event-details (cùng thư mục)
          window.location.href = `event-details.html?eventId=${encodeURIComponent(event.id)}`;
        });

        const imgElement = document.createElement('img');
        imgElement.src = image;
        imgElement.alt = event.name;
        imgElement.loading = 'lazy';
        imgElement.onerror = function () { /* ... */ };
        eventCard.appendChild(imgElement);

        const eventInfo = document.createElement('div');
        eventInfo.className = 'event-info';

        // Dùng các hàm đã được tải từ 'events.js'
        const safeName = sanitizeHTML(event.name);
        const safePrice = sanitizeHTML(price);
        const safeDate = sanitizeHTML(date);

        eventInfo.innerHTML = `
        <p class="event-name">${safeName}</p>
        <p class="event-price">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"></path><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"></path><path d="M12 17.5v-11"></path></svg>
      ${safePrice}
        </p>
        <p class="event-date">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg>
      ${safeDate}
        </p>
        `;
        eventCard.appendChild(eventInfo);
        gridElement.appendChild(eventCard);
      });
    }

    /**
     * Hàm chính: Đọc URL, gọi API và render
     */
    async function loadSearchResults() {
      const urlParams = new URLSearchParams(window.location.search);
      const searchQuery = urlParams.get('q');
      const category = urlParams.get('category');
      const city = urlParams.get('city');

      const resultsText = document.getElementById('results-text');
      const categoryButton = document.getElementById('category-button');
      const grid = document.getElementById('event-grid-search');
      const searchInput = document.getElementById('search-input');

      // 1. Cập nhật UI (filters)
      let title = 'Tất cả sự kiện';
      if (searchQuery) {
        title = `Kết quả cho: "${sanitizeHTML(searchQuery)}"`;
        searchInput.value = searchQuery;
      } else if (category) {
        const categoryMap = {
          'music': 'Nhạc sống', 'art': 'Sân khấu & Nghệ thuật', 'sport': 'Thể thao',
          'special': 'Sự kiện đặc biệt', 'trending': 'Sự kiện xu hướng',
          'foryou': 'Dành cho bạn', 'other': 'Khác'
        };
        title = `Danh mục: ${categoryMap[category] || category}`;
        categoryButton.textContent = categoryMap[category] || category;
      } else if (city) {
        const cityMap = { 'hanoi': 'Hà Nội', 'hcm': 'Hồ Chí Minh', 'danang': 'Đà Nẵng' };
        title = `Địa điểm: ${cityMap[city] || city}`;
        categoryButton.textContent = cityMap[city] || city;
      }
      resultsText.textContent = title;

      // 2. Xây dựng URL API
      const apiParams = new URLSearchParams();
      if (searchQuery) apiParams.append('q', searchQuery);
      if (category) apiParams.append('category', category);
      if (city) apiParams.append('city', city);

      // Dùng EVENTS_BASE từ file events.js
      const apiUrl = `${EVENTS_BASE}?${apiParams.toString()}`;

      // 3. Gọi API và Render
      try {
        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const events = data?.items || [];
        renderEventsToGrid(events, grid);
      } catch (err) {
        console.error('Lỗi tải sự kiện:', err);
        grid.innerHTML = '<p style="color: var(--red); grid-column: 1 / -1; text-align: center;">Không thể tải sự kiện.</p>';
      }
    }

    // === KHỞI CHẠY ===
    document.addEventListener('DOMContentLoaded', () => {
      // Chạy Auth UI (từ events.js)
      if (typeof renderAuthUI === 'function') {
        renderAuthUI();
      }
      // Chạy hàm tìm kiếm
      loadSearchResults();
    });
  </script>
</body>

</html>
