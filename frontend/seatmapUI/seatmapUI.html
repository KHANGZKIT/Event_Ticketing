<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chọn ghế</title>
  <meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  connect-src 'self' http://localhost:4000 ws://localhost:4000;
  img-src 'self' https://salt.tkbcdn.com data:;
  style-src 'self' 'unsafe-inline';
  script-src 'self' 'unsafe-inline' http://localhost:4000;
">
  <link rel="stylesheet" href="/frontend/seatmapUI/style/seatmap.css" />
  <link rel="stylesheet" href="/frontend/seatmapUI/style/ticket.css">
</head>

<body>
  <!-- Theme Toggle Button -->
  <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
    <!-- Moon icon (dark mode) -->
    <svg class="theme-icon-dark" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
    <!-- Sun icon (light mode) -->
    <svg class="theme-icon-light" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
  </button>

  <div class="layout">
    <!-- SIDEBAR: Thông tin sự kiện + giỏ -->
    <aside class="sidebar">
      <div class="event-card">
        <h2 class="event-title" id="eventTitle">Live Concert 2025</h2>
        <div class="event-meta">
          <div class="event-row">
            <label for="showSelect" style="font-weight:600;margin-right:8px">Suất chiếu</label>
            <div class="event-row" style="margin-top:8px">
              <span id="eventDate"></span>
            </div>
            <div class="event-row" style="margin-top:4px">
              <span id="eventPlace"></span>
            </div>
            <select id="showSelect" style="padding:8px 10px;border:1px solid #e5e7eb;border-radius:10px;"></select>
          </div>
        </div>
      </div>

      <div class="cart">
        <div class="cart-head">
          <h3>Ghế đã chọn</h3>
          <div class="prices">
            <div class="price-line">
              <span>VIP</span><strong id="priceVip">150.000đ</strong>
            </div>
            <div class="price-line">
              <span>Thường</span><strong id="priceNormal">100.000đ</strong>
            </div>
          </div>
        </div>

        <div class="cart-body">
          <table class="cart-table" id="cartTable">
            <thead>
              <tr>
                <th>Ghế</th>
                <th>Loại</th>
                <th>Giá</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <!-- render bằng JS -->
            </tbody>
          </table>
        </div>

        <div class="cart-foot">
          <div class="total-line">
            <span>Tổng</span>
            <strong id="cartTotal">0đ</strong>
          </div>
          <button id="checkoutBtn" class="btn-primary">Đặt vé</button>
        </div>
      </div>
    </aside>

    <!-- MAIN: Sân khấu + sơ đồ ghế -->
    <main class="main">
      <div class="container">
        <div class="stagePanel">
          <div class="screen">SÂN KHẤU</div>
        </div>

        <div class="map">
          <div class="seat-map" id="seatMap"></div>

          <div class="legend">
            <div class="legend-item">
              <div class="legend-box vip"></div>
              <div class="legend-info">
                <span class="legend-type">VIP</span>
                <span class="legend-price" id="legendVipPrice">150.000đ</span>
              </div>
            </div>
            <div class="legend-item">
              <div class="legend-box normal"></div>
              <div class="legend-info">
                <span class="legend-type">Thường</span>
                <span class="legend-price" id="legendNormalPrice">100.000đ</span>
              </div>
            </div>
            <div class="legend-item">
              <div class="legend-box booked"></div>
              <div class="legend-info">
                <span class="legend-type">Đã đặt</span>
              </div>
            </div>
            <div class="legend-item">
              <div class="legend-box selected"></div>
              <div class="legend-info">
                <span class="legend-type">Đang chọn</span>
              </div>
            </div>
            <div class="legend-item">
              <div class="legend-box purchasing"></div>
              <div class="legend-info">
                <span class="legend-type">Đang thanh toán</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!--billPanel !-->

  <!-- MODAL CHECKOUT -->
  <div id="checkoutModal" class="modal-overlay" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalEvent">
      <div class="modal-body">
        <div class="ticket">
          <div class="ticket-left">
            <div class="brand">TICKETBOOK</div>
            <h2 class="event" id="modalEvent">Live Concert 2025</h2>
            <div class="meta">
              <span id="modalDate">20/11/2025 · 19:30</span>
              <span id="modalPlace">Nhà thi đấu Quân khu 7</span>
            </div>
            <div class="serial" id="modalSeats">Ghế: (chưa có)</div>
          </div>
          <div class="ticket-right">
            <div class="price-badge" id="modalTotal">0đ</div>
            <div class="qr"><img src="OIP.webp" alt=""></div>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button id="modalPay" class="btn-ok">Thanh toán</button>
        <button id="modalClose" class="btn-cancel">Hủy</button>
      </div>
    </div>
  </div>

  <script src="http://localhost:4000/socket.io/socket.io.js"></script>

  <script src="/frontend/seatmapUI/script/seatmap.js"></script>

  <!-- Theme Toggle Script -->
  <script>
    (function () {
      const toggle = document.getElementById('themeToggle');
      const html = document.documentElement;

      // Load saved theme or default to dark
      const savedTheme = localStorage.getItem('seatmap-theme') || 'dark';
      if (savedTheme === 'light') {
        html.dataset.theme = 'light';
      }

      toggle.addEventListener('click', () => {
        const isLight = html.dataset.theme === 'light';
        html.dataset.theme = isLight ? '' : 'light';
        localStorage.setItem('seatmap-theme', isLight ? 'dark' : 'light');
      });
    })();
  </script>
</body>

</html>
